  - source_name: Vision Systems Design
    domain: visionsystemsdesign.com
    base_urls:
      - https://www.vision-systems.com/
    source_type: trade_article
    priority: 4
    allowed_content_types: [html]
    crawl_strategy: manual_review_only
    max_pages: 2
    notes: Only crawl publicly accessible and robots-allowed pages after manual review.
